[pytest]
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*
testpaths = tests
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    e2e: End-to-end tests (requires full system)
    slow: Slow tests (>1 second)
    asyncio: Async tests

asyncio_mode = auto

[coverage:run]
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*
    */.venv/*
    */venv/*
    */migrations/*
    */config.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
